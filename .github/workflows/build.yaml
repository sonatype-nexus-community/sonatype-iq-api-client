name: Validate

on:
    push:
        branches: ['main']
    pull_request:
        branches-ignore: ['dependabot/**']
    workflow_dispatch:
    schedule:
        # schedule weekly tests, since some dependencies are not intended to be pinned
        # this means: at 23:42 on Fridays
        - cron: '42 23 * * 5'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    OPEN_API_GENERATOR_VERSION: 'v7.16.0'
    PYTHON_VERSION_DEFAULT: '3.12'
    POETRY_VERSION: '2.2.1'

jobs:
    generate-library-code:
        name: Generate Library Code ${{ matrix.language }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                language: ['go', 'python', 'typescript']
        steps:
            - name: Checkout
              # see https://github.com/actions/checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Create Output Directory
              run: mkdir out/${{ matrix.language }}

            - name: Run OpenAPI Generator
              env:
                  LANGUAGE: ${{ matrix.language }}
              run: |
                  docker run --rm \
                      -v "${GITHUB_WORKSPACE}:/local" \
                      "openapitools/openapi-generator-cli:${OPEN_API_GENERATOR_VERSION}" \
                      batch --clean "/local/${LANGUAGE}.yaml"

            - name: Copy LICENSE
              run: cp LICENSE ./out/${{ matrix.language }}

            - name: Save to Cache
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: out/${{ matrix.language }}
                  key: '${{ matrix.language }}-${{ github.run_id }}'

    validate-go:
        name: Validate Go Library
        runs-on: ubuntu-latest
        needs: generate-library-code

        steps:
            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: '1.23'
            - name: Get generated code from cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: out/go
                  key: 'go-${{ github.run_id }}'
                  fail-on-cache-miss: true
            - name: Build Go API Client
              run: go build -v ./
              working-directory: out/go
            - name: Install test dependencies & run generated tests
              run: |
                  go get github.com/stretchr/testify/assert
                  go test -v ./test/
              working-directory: out/go

    validate-python:
        name: Validate Python Library
        runs-on: ubuntu-latest
        needs: generate-library-code

        steps:
            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
            - name: Install poetry
              # see https://github.com/marketplace/actions/setup-poetry
              uses: Gr1N/setup-poetry@a05ec55cc26a7270e246efc79ee3ce1bcd6814a0 # v10
              with:
                  poetry-version: ${{ env.POETRY_VERSION }}
            - name: Get generated code from cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: out/python
                  key: 'python-${{ github.run_id }}'
                  fail-on-cache-miss: true
            - name: Install dependencies
              run: poetry install --no-root
              working-directory: out/python

            - name: Ensure build successful
              run: poetry build
              working-directory: out/python

            - name: Run Tests
              run: |
                  pip install -r test-requirements.txt
                  poetry run pytest
              working-directory: out/python

    validate-typescript:
        name: Validate Typescript Library
        runs-on: ubuntu-latest
        needs: generate-library-code

        steps:
            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: latest
            - name: Get generated code from cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: out/typescript
                  key: 'typescript-${{ github.run_id }}'
                  fail-on-cache-miss: true
            - name: Build Typescript API Client
              run: npm i && npm run build
              working-directory: out/typescript
